services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: thirdshift
      POSTGRES_USER: thirdshift
      POSTGRES_PASSWORD: thirdshift_dev_password
    ports:
      - "${THIRDSHIFT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thirdshift -d thirdshift"]
      interval: 5s
      timeout: 5s
      retries: 10

  coordinator:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      THIRDSHIFT_COORDINATOR_ADDR: ":8080"
      THIRDSHIFT_VERSION: "0.1.0-alpha.0"
      DATABASE_URL: "postgres://thirdshift:thirdshift_dev_password@postgres:5432/thirdshift?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres-data:
