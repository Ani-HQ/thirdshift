services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: thirdshift
      POSTGRES_USER: thirdshift
      POSTGRES_PASSWORD: thirdshift_dev_password
    ports:
      - "${THIRDSHIFT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thirdshift -d thirdshift"]
      interval: 5s
      timeout: 5s
      retries: 10

  coordinator:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      THIRDSHIFT_COORDINATOR_ADDR: ":8080"
      THIRDSHIFT_VERSION: "0.1.0-alpha"
      THIRDSHIFT_OPERATOR_TOKEN: "${THIRDSHIFT_OPERATOR_TOKEN:-dev-operator-token}"
      THIRDSHIFT_ACCESS_TOKEN_SECRET: "${THIRDSHIFT_ACCESS_TOKEN_SECRET:-dev-access-token-secret-change-me}"
      THIRDSHIFT_HEARTBEAT_INTERVAL_SECONDS: "${THIRDSHIFT_HEARTBEAT_INTERVAL_SECONDS:-15}"
      THIRDSHIFT_SESSION_STALE_AFTER_SECONDS: "${THIRDSHIFT_SESSION_STALE_AFTER_SECONDS:-45}"
      THIRDSHIFT_STALE_SWEEP_INTERVAL_SECONDS: "${THIRDSHIFT_STALE_SWEEP_INTERVAL_SECONDS:-15}"
      THIRDSHIFT_REQUESTER_REGION_HEADER: "${THIRDSHIFT_REQUESTER_REGION_HEADER:-X-Geo-Region}"
      THIRDSHIFT_SCHEDULER_WEIGHT_WARM_MODEL: "${THIRDSHIFT_SCHEDULER_WEIGHT_WARM_MODEL:-40}"
      THIRDSHIFT_SCHEDULER_WEIGHT_SUCCESS_RATE: "${THIRDSHIFT_SCHEDULER_WEIGHT_SUCCESS_RATE:-20}"
      THIRDSHIFT_SCHEDULER_WEIGHT_TOKENS_PER_SECOND: "${THIRDSHIFT_SCHEDULER_WEIGHT_TOKENS_PER_SECOND:-15}"
      THIRDSHIFT_SCHEDULER_WEIGHT_RECENT_FAILURE: "${THIRDSHIFT_SCHEDULER_WEIGHT_RECENT_FAILURE:-10}"
      THIRDSHIFT_SCHEDULER_WEIGHT_THERMAL: "${THIRDSHIFT_SCHEDULER_WEIGHT_THERMAL:-5}"
      THIRDSHIFT_SCHEDULER_WEIGHT_FAIRNESS: "${THIRDSHIFT_SCHEDULER_WEIGHT_FAIRNESS:-5}"
      THIRDSHIFT_SCHEDULER_WEIGHT_REGION: "${THIRDSHIFT_SCHEDULER_WEIGHT_REGION:-5}"
      DATABASE_URL: "postgres://thirdshift:thirdshift_dev_password@postgres:5432/thirdshift?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../models/catalog:/app/models/catalog:ro
    ports:
      - "8080:8080"

  console:
    image: node:18-alpine
    working_dir: /app
    environment:
      NEXT_PUBLIC_BASE_PATH: ""
      NEXT_PUBLIC_THIRDSHIFT_API_BASE: ""
    volumes:
      - ../web/console:/app
    command: sh -c "npm ci && npm run build && npm run start -- -H 0.0.0.0 -p 3000"
    depends_on:
      - coordinator

  caddy:
    image: caddy:2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8081:8081"
    depends_on:
      - coordinator
      - console

volumes:
  postgres-data:
