name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - name: Build release binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="${GITHUB_SHA}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION_PKG="github.com/Ani-HQ/thirdshift/internal/shared/version"
          LDFLAGS="-X ${VERSION_PKG}.Version=${VERSION} -X ${VERSION_PKG}.Commit=${COMMIT} -X ${VERSION_PKG}.BuildDate=${BUILD_DATE}"

          mkdir -p dist/windows-amd64 dist/linux-amd64 dist/darwin-arm64

          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/windows-amd64/thirdshift.exe ./cmd/thirdshift

          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/linux-amd64/thirdshift ./cmd/thirdshift
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/linux-amd64/coordinator ./cmd/coordinator
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/linux-amd64/admin-cli ./cmd/admin-cli

          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/darwin-arm64/thirdshift ./cmd/thirdshift
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/darwin-arm64/coordinator ./cmd/coordinator
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/darwin-arm64/admin-cli ./cmd/admin-cli

      - name: Package artifacts
        run: |
          set -euo pipefail
          (cd dist/windows-amd64 && zip -q -r ../thirdshift-windows-amd64.zip .)
          (cd dist/linux-amd64 && zip -q -r ../thirdshift-linux-amd64.zip .)
          (cd dist/darwin-arm64 && zip -q -r ../thirdshift-darwin-arm64.zip .)
          cp scripts/install.ps1 dist/install.ps1
          cp scripts/uninstall.ps1 dist/uninstall.ps1
          (cd dist && sha256sum thirdshift-*.zip > SHA256SUMS)

      - name: Generate signed release manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_KEY_ID: ${{ secrets.RELEASE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          go run ./scripts/release-manifest \
            --version "${GITHUB_REF_NAME#v}" \
            --build-id "${GITHUB_SHA}" \
            --dist dist \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --out dist/release-manifest.json

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/thirdshift-windows-amd64.zip \
            dist/thirdshift-linux-amd64.zip \
            dist/thirdshift-darwin-arm64.zip \
            dist/SHA256SUMS \
            dist/release-manifest.json \
            dist/install.ps1 \
            dist/uninstall.ps1 \
            --draft \
            --title "Thirdshift ${GITHUB_REF_NAME}" \
            --notes "Draft alpha release generated by CI. Verify signing-key status before publishing."
